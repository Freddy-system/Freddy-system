<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Freddy Sedano, Full Stack Developer">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset=".6" stop-color="#101a2e"/><stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8fb4e8" opacity=".12"/></pattern>
    <clipPath id="marco"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cursor{animation:parpadeo 1.1s steps(2,start) infinite}
      @keyframes parpadeo{to{visibility:hidden}}
      @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#marco)">
    <rect width="1200" height="300" fill="url(#fondo)"/>
    <rect width="1200" height="300" fill="url(#puntos)"/>
    <rect width="1200" height="5" fill="url(#acento)"/>
    <text x="64" y="118" font-size="58" font-weight="700" fill="#f0f6fc">Freddy Sedano</text>
    <text x="66" y="162" font-size="25" fill="#c9d1d9">Full Stack Developer · DevOps &amp; Cloud · Automation &amp; AI</text>
    <text x="66" y="222" font-size="19" class="mono" fill="#3fb950">$<tspan fill="#8b949e"> software listo para producción: </tspan><tspan fill="#f0f6fc">rápido, escalable y seguro</tspan><tspan class="cursor" fill="#58a6ff"> ▌</tspan></text>
    <g transform="translate(884 62)">
      <rect width="256" height="176" rx="12" fill="#0d1117" stroke="#30435f"/>
      <circle cx="22" cy="22" r="5" fill="#f85149"/><circle cx="40" cy="22" r="5" fill="#d29922"/><circle cx="58" cy="22" r="5" fill="#3fb950"/>
      <g class="mono" font-size="15">
        <text x="22" y="62" fill="#ff7b72">const <tspan fill="#d2a8ff">dev</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
        <text x="40" y="88" fill="#79c0ff">web<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">true</tspan><tspan fill="#c9d1d9">,</tspan></text>
        <text x="40" y="112" fill="#79c0ff">mobile<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">true</tspan><tspan fill="#c9d1d9">,</tspan></text>
        <text x="40" y="136" fill="#79c0ff">cloud<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">true</tspan><tspan fill="#c9d1d9">,</tspan></text>
        <text x="22" y="160" fill="#c9d1d9">};</text>
      </g>
    </g>
  </g>
</svg>
