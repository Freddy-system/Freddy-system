<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Freddy Sedano, Full Stack Developer">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .n{fill:#6e7681}.p{fill:#c9d1d9}.k{fill:#ff7b72}.v{fill:#d2a8ff}.c{fill:#79c0ff}.b{fill:#ffa657}
  </style>
  <rect x="1" y="1" width="1198" height="258" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="108" font-size="58" font-weight="700" fill="#f0f6fc">Freddy Sedano</text>
  <text x="66" y="152" font-size="25" fill="#c9d1d9">Full Stack Developer · DevOps &amp; Cloud · Automation &amp; AI</text>
  <text x="66" y="204" font-size="19" class="mono" fill="#8b949e">Software listo para producción: rápido, escalable y seguro</text>
  <g transform="translate(868 46)" font-size="16">
    <rect width="272" height="168" rx="8" fill="#161b22" stroke="#30363d"/>
    <text class="mono n" x="16" y="38">1</text><text class="mono" x="44" y="38"><tspan class="k">const</tspan><tspan class="v"> dev</tspan><tspan class="p"> = {</tspan></text>
    <text class="mono n" x="16" y="66">2</text><text class="mono" x="44" y="66" xml:space="preserve"><tspan class="c">  web</tspan><tspan class="p">: </tspan><tspan class="b">true</tspan><tspan class="p">,</tspan></text>
    <text class="mono n" x="16" y="94">3</text><text class="mono" x="44" y="94" xml:space="preserve"><tspan class="c">  mobile</tspan><tspan class="p">: </tspan><tspan class="b">true</tspan><tspan class="p">,</tspan></text>
    <text class="mono n" x="16" y="122">4</text><text class="mono" x="44" y="122" xml:space="preserve"><tspan class="c">  cloud</tspan><tspan class="p">: </tspan><tspan class="b">true</tspan><tspan class="p">,</tspan></text>
    <text class="mono n" x="16" y="150">5</text><text class="mono p" x="44" y="150">};</text>
